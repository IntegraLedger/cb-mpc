## OpenSSL target for cb-mpc on WebAssembly: wasm32 pointers, 64-bit bignum words.
##
## cb-mpc's constant-time bignum code assumes BN_ULONG is 64 bits (upstream supports only 64-bit
## targets). wasm has native i64 arithmetic, so SIXTY_FOUR_BIT gives the browser build the same
## word size as the native one instead of patching each 64-bit assumption for 32-bit words.
my %targets = (
    "wasm32-bn64" => {
        inherit_from => [ "linux-generic32" ],
        bn_ops       => "SIXTY_FOUR_BIT RC4_CHAR",
    },
);
